name: Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow fonttools

      - name: Install JieLi Toolchain
        run: |
          mkdir -p ~/.jieli
          chmod +x tools/get_toolchain.sh
          ./tools/get_toolchain.sh

      - name: Build Firmware
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: felucca-firmware
          path: firmware/
